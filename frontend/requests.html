</style></head><body data-page="requests"><div id="app"></div><script>
/* BorrowBuy frontend demo: all data is fictional and stays in this browser. */
const $ = (s, root = document) => root.querySelector(s);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storage = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem('bb_'+key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem('bb_'+key, JSON.stringify(value)); return true; } catch { toast('Browser storage is full. Try a smaller photo.'); return false; } }
};
const sampleItems = [
  {id:'calculator',name:'Scientific Calculator',description:'A reliable companion for your next exam. Fully working and ready to borrow.',category:'Electronics',condition:'Good',price:20,owner:'Priya',image:'assets/calculator.png'},
  {id:'labcoat',name:'White Lab Coat',description:'Clean, comfortable and ready for your next lab session. Size medium.',category:'Lab essentials',condition:'Like new',price:15,owner:'Aarav',image:'assets/labcoat.png'},
  {id:'books',name:'Engineering Textbooks',description:'A helpful set of first-year books, well cared for and ready to share.',category:'Books',condition:'Good',price:10,owner:'Riya',image:'assets/books.png'}
];
const demoRequests = [{id:'demo-in',itemId:'labcoat',name:'White Lab Coat',image:'assets/labcoat.png',person:'Aarav',start:'2026-11-20',end:'2026-11-22',price:15,status:'pending',direction:'incoming'},{id:'demo-out',itemId:'calculator',name:'Scientific Calculator',image:'assets/calculator.png',person:'Priya',start:'2026-11-21',end:'2026-11-23',price:20,status:'accepted',direction:'outgoing'}];

const requests = () => storage.get('requests',demoRequests);
const params = new URLSearchParams(location.search);
const page = document.body.dataset.page;
const toast = text => { const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),3000); };
function header(){return `<div class="topnote">✳ &nbsp; A LITTLE SHARING GOES A LONG WAY &nbsp; · &nbsp; FRONTEND PROTOTYPE</div><header class="header"><div class="container header-inner"><a class="brand" href="home.html"><b class="brand-icon">♧</b><span>Borrow<em>Buy</em></span></a><nav class="nav" aria-label="Main navigation"><a class="${page==='home'?'active':''}" href="home.html">Home</a><a class="${page==='search'?'active':''}" href="search.html">Explore items</a><a class="${page==='requests'||page==='chat'?'active':''}" href="requests.html">My requests</a></nav><div class="header-right"><a class="button light header-label" href="list.html">＋ &nbsp; List an item</a><a class="avatar" href="index.html" aria-label="Account">${esc((storage.get('name','Guest')||'G')[0].toUpperCase())}</a></div></div></header>`}
function bottom(){return `<nav class="mobile-nav" aria-label="Mobile navigation"><a class="${page==='home'?'active':''}" href="home.html"><span>⌂</span>Home</a><a class="${page==='search'?'active':''}" href="search.html"><span>⌕</span>Search</a><a class="${page==='list'?'active':''}" href="list.html"><span>⊕</span>List</a><a class="${page==='requests'||page==='chat'?'active':''}" href="requests.html"><span>▤</span>Requests</a><a class="${page==='login'?'active':''}" href="index.html"><span>♙</span>Account</a></nav>`}
function footer(){return `<footer class="footer"><div class="container"><span>© BorrowBuy · A little more sharing, a little less buying.</span><span>Prototype only · Sample data · No real transactions</span></div></footer>`}
function layout(content){$('#app').innerHTML=header()+content+footer()+bottom()}
function card(x){return `<article class="card"><a href="item.html?id=${encodeURIComponent(x.id)}" class="card-img"><img src="${esc(x.image)}" alt="${esc(x.name)}"><span class="badge">Available</span></a><div class="card-body"><span class="category">${esc(x.category)}</span><div class="card-title"><h3>${esc(x.name)}</h3><span class="price">₹${esc(x.price)} <small>/ day</small></span></div><p class="card-desc">${esc(x.condition)} condition · Ready to borrow</p><div class="card-bottom"><span class="owner"><span class="avatar">${esc(x.owner[0].toUpperCase())}</span> ${esc(x.owner)}</span><a class="text-link" href="item.html?id=${encodeURIComponent(x.id)}">View item ↗</a></div></div></article>`}
function pageIntro(tag,title,desc){return `<div class="page-top"><div class="eyebrow">${tag}</div><h1>${title}</h1><p>${desc}</p></div>`}
function showLogin(signup=false){layout(`<main class="container auth-wrap"><section class="auth-copy"><div class="eyebrow">A community that shares</div><h1>Borrow more.<br><em>Buy less.</em></h1><p>Good things are better shared. Find what you need, lend what you don't, and make campus life a little lighter.</p><div class="auth-visual"><img src="assets/books.png" alt="A stack of books ready to share"></div></section><section class="panel auth-panel"><div class="tabs"><button class="tab ${!signup?'active':''}" id="login-tab">Log in</button><button class="tab ${signup?'active':''}" id="signup-tab">Sign up</button></div><div class="eyebrow">${signup?'Join the community':'Nice to see you again'}</div><h2>${signup?'Start sharing.':'Welcome back.'}</h2><p>${signup?'Create a demo profile and explore BorrowBuy.':'Your next great borrow is just around the corner.'}</p><form id="auth-form">${signup?'<div class="field"><label for="name">Your name</label><input id="name" placeholder="What should we call you?" required></div>':''}<div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required><span class="form-hint">Any email address is welcome. No college email required.</span></div><div class="notice">This is a visual demo, not a real account. Please do not enter passwords or personal information.</div><button class="button full" style="margin-top:18px" type="submit">${signup?'Create demo profile':'Continue to demo'} &nbsp; ↗</button></form><div class="auth-bottom">${signup?'Already exploring?':'New around here?'} <button id="switch-auth">${signup?'Log in':'Sign up'}</button></div></section></main>`);$('#login-tab').onclick=()=>showLogin(false);$('#signup-tab').onclick=()=>showLogin(true);$('#switch-auth').onclick=()=>showLogin(!signup);$('#auth-form').onsubmit=e=>{e.preventDefault();storage.set('name',signup?$('#name').value.trim()||'Guest':'Guest');location.href='home.html'} }
function home(){layout(`<main class="container"><section class="hero"><div class="hero-content"><div class="eyebrow">Your community, shared</div><h1>Borrow more.<br><em>Buy less.</em></h1><p>From last-minute essentials to everyday favourites, find what you need right in your community.</p><div class="hero-actions"><form class="searchbar" action="search.html"><span>⌕</span><input name="q" aria-label="Search items" placeholder="Try ‘calculator’ or ‘books’"><button class="button small-btn">Search</button></form><a class="button light" href="list.html">＋ List an item</a></div></div><div class="hero-art"><img src="assets/books.png" alt=""></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Something for everyone</div><h2>Recently shared</h2><p>Little things making a big difference, one borrow at a time.</p></div><a class="text-link" href="search.html">Explore all items &nbsp; →</a></div><div class="grid">${items().slice(0,3).map(card).join('')}</div></section><section class="how"><div><div class="eyebrow">Simple by design</div><h2>Sharing made easy.</h2><p>Everything you need, in three little steps.</p></div><div class="step"><span class="step-num">1</span><div><strong>Find something</strong><p>Browse items shared by your community.</p></div></div><div class="step"><span class="step-num">2</span><div><strong>Send a request</strong><p>Agree on the dates and details together.</p></div></div><div class="step"><span class="step-num">3</span><div><strong>Borrow & return</strong><p>Use what you need and pass it back.</p></div></div></section></main>`)}
function search(){layout(`<main class="container">${pageIntro('The community shelf','Find your next borrow.','A little search goes a long way. Discover useful things shared around you.')}<form class="searchbar" id="search-form" style="max-width:100%;margin-bottom:20px"><span>⌕</span><input id="query" aria-label="Search listings" placeholder="Search by item or category" value="${esc(params.get('q')||'')}"><button class="button small-btn">Search</button></form><div class="chips" id="filters"></div><div class="section-head"><div><h2>Explore items</h2><p id="result-count"></p></div><a class="text-link" href="list.html">Have something to share? →</a></div><div class="grid" id="results"></div></main>`);let category='All';const categories=['All','Electronics','Lab essentials','Books','Other'];function render(){const q=$('#query').value.toLowerCase().trim();const filtered=items().filter(i=>(category==='All'||i.category===category)&&`${i.name} ${i.description} ${i.category}`.toLowerCase().includes(q));$('#filters').innerHTML=categories.map(c=>`<button class="chip ${c===category?'active':''}" data-filter="${c}">${c}</button>`).join('');$('#results').innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty">No items found. Try a different search or category.</div>';$('#result-count').textContent=`${filtered.length} ${filtered.length===1?'item':'items'} to discover`;$('#filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.filter;render()})}$('#search-form').onsubmit=e=>{e.preventDefault();render()};$('#query').oninput=render;render()}
function item(){const x=items().find(i=>i.id===params.get('id'));if(!x){layout(`<main class="container">${pageIntro('Not found','This item isn’t here.','Try exploring the community shelf instead.')}<a class="button" href="search.html">Explore items</a></main>`);return}layout(`<main class="container">${pageIntro('A little more detail','Meet your next borrow.','<a class="text-link" href="search.html">← Back to all items</a>')}<div class="item-layout"><img class="item-photo" src="${esc(x.image)}" alt="${esc(x.name)}"><section><span class="category">${esc(x.category)} &nbsp; · &nbsp; Available</span><h2 style="font-size:40px;margin:12px 0">${esc(x.name)}</h2><p class="muted" style="line-height:1.8">${esc(x.description)}</p><div class="detail-price">₹${esc(x.price)} <small>/ day</small></div><div class="detail-row"><span>Shared by</span><strong>${esc(x.owner)}</strong></div><div class="detail-row"><span>Condition</span><strong>${esc(x.condition)}</strong></div><div class="detail-row"><span>Category</span><strong>${esc(x.category)}</strong></div><div class="notice" style="margin:22px 0">✳ &nbsp; Review your dates and price before sending a request. The owner decides whether to accept.</div><a class="button full" href="request.html?id=${encodeURIComponent(x.id)}">Request to borrow &nbsp; ↗</a></section></div></main>`)}
function list(){layout(`<main class="container">${pageIntro('Give good things another life','Share something useful.','List an item and help someone in your community.')}<div class="layout"><form class="panel" id="list-form"><div class="eyebrow">Your listing</div><h2 style="margin:9px 0 22px">Tell us about your item.</h2><div class="upload"><strong>＋ &nbsp; Add a product photo</strong><p class="form-hint" style="margin:8px 0 12px">Choose one image, up to 1 MB. It stays in this browser.</p><input id="photo" type="file" accept="image/*" aria-label="Product photo"></div><div class="field"><label for="name">Product name</label><input id="name" required maxlength="80" placeholder="e.g. Scientific calculator"></div><div class="field"><label for="desc">Description</label><textarea id="desc" required maxlength="500" placeholder="What should a borrower know?"></textarea></div><div class="form-grid"><div class="field"><label for="condition">Condition</label><select id="condition"><option>Like new</option><option>Good</option><option>Well used</option></select></div><div class="field"><label for="category">Category</label><select id="category"><option>Electronics</option><option>Lab essentials</option><option>Books</option><option>Other</option></select></div></div><div class="field"><label for="price">Borrow price (₹ per day)</label><input id="price" type="number" min="0" max="100000" step="1" required placeholder="0"></div><button class="button full">Publish demo listing &nbsp; ↗</button></form><aside><div class="panel"><div class="eyebrow">A thoughtful listing</div><h2 style="margin:10px 0;font-size:27px">A little detail helps.</h2><p class="muted" style="line-height:1.8">A clear photo and honest description help someone know exactly what they are borrowing.</p><div class="notice" style="margin-top:20px">This listing is saved only in your browser. It isn’t visible to other people and there are no real payments.</div></div></aside></div></main>`);$('#list-form').onsubmit=async e=>{e.preventDefault();const f=$('#photo').files[0];if(f&&f.size>1024*1024){toast('Please choose an image smaller than 1 MB.');return}let image='assets/books.png';if(f) image=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});let x={id:'local-'+Date.now(),name:$('#name').value.trim(),description:$('#desc').value.trim(),category:$('#category').value,condition:$('#condition').value,price:Number($('#price').value),owner:storage.get('name','You')||'You',image};if(storage.set('items',[x,...storage.get('items',[])]))location.href='item.html?id='+encodeURIComponent(x.id)}}
function request(){const x=items().find(i=>i.id===params.get('id'));if(!x){location.href='search.html';return}layout(`<main class="container">${pageIntro('One step closer','Make a request.','Choose your dates and review the details before you send.')}<div class="layout"><form class="panel" id="request-form"><div class="eyebrow">Borrowing agreement</div><h2 style="margin:10px 0 22px">The important details.</h2><div class="form-grid"><div class="field"><label for="start">Borrow from</label><input id="start" type="date" required></div><div class="field"><label for="end">Return by</label><input id="end" type="date" required></div></div><div class="detail-row"><span>Price per day</span><strong>₹${esc(x.price)}</strong></div><div class="detail-row"><span>Estimated total</span><strong id="total">Select dates</strong></div><p class="form-hint" style="margin:12px 0 20px">Dates are counted inclusively. The agreed item, dates and price are saved with your demo request.</p><div class="notice">The owner can accept or decline. You can discuss other conditions in the request chat; important terms should be confirmed in the agreement.</div><button class="button full" style="margin-top:20px">Send demo request &nbsp; ↗</button></form><aside class="panel"><div class="eyebrow">Your selected item</div><img src="${esc(x.image)}" alt="${esc(x.name)}" style="width:100%;height:190px;object-fit:cover;border-radius:10px;margin:16px 0"><h3>${esc(x.name)}</h3><p class="muted" style="margin-top:8px">Shared by ${esc(x.owner)} · ${esc(x.condition)} condition</p></aside></div></main>`);const update=()=>{let a=$('#start').value,b=$('#end').value;let days=(Date.parse(b)-Date.parse(a))/86400000+1;$('#total').textContent=a&&b&&days>0?`₹${days*x.price} · ${days} day${days===1?'':'s'}`:'Select valid dates'};$('#start').onchange=update;$('#end').onchange=update;$('#request-form').onsubmit=e=>{e.preventDefault();let start=$('#start').value,end=$('#end').value;if(end<start){toast('Return date must be on or after the start date.');return}let r={id:'req-'+Date.now(),itemId:x.id,name:x.name,image:x.image,person:x.owner,start,end,price:x.price,condition:x.condition,status:'pending',direction:'outgoing'};if(storage.set('requests',[r,...requests()]))location.href='requests.html?tab=outgoing'}}
function requestsPage(){let tab=params.get('tab')==='outgoing'?'outgoing':'incoming';layout(`<main class="container">${pageIntro('Keep everything in one place','Your requests.','Follow your borrowing journey and stay in the loop.')}<div class="tabs"><button class="tab" id="incoming">Incoming</button><button class="tab" id="outgoing">Outgoing</button></div><div class="notice" style="margin-bottom:20px">These are sample requests and browser-only interactions. They are not shared with real users.</div><div id="request-list"></div></main>`);function render(){ $('#incoming').classList.toggle('active',tab==='incoming');$('#outgoing').classList.toggle('active',tab==='outgoing');const rs=requests().filter(r=>r.direction===tab);$('#request-list').innerHTML=rs.length?rs.map(r=>`<article class="request-card"><img src="${esc(r.image)}" alt=""><div class="request-info"><h3>${esc(r.name)} &nbsp; <span class="status ${esc(r.status)}">${esc(r.status)}</span></h3><p>${tab==='incoming'?'Requested by':'Owner'} ${esc(r.person)} · ${esc(r.start)} to ${esc(r.end)}<br>Agreed price: ₹${esc(r.price)} / day</p></div><div class="request-actions">${tab==='incoming'&&r.status==='pending'?`<button class="button small-btn" data-action="accepted" data-id="${esc(r.id)}">Accept</button><button class="button light small-btn" data-action="declined" data-id="${esc(r.id)}">Decline</button>`:''}${tab==='incoming'&&r.status==='accepted'?`<button class="button small-btn" data-action="returned" data-id="${esc(r.id)}">Confirm return</button>`:''}<a class="button light small-btn" href="chat.html?id=${encodeURIComponent(r.id)}">Chat ↗</a></div></article>`).join(''):'<div class="panel empty">Nothing here yet. Explore items and send a request to get started.<br><a class="text-link" href="search.html">Explore items →</a></div>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let all=requests().map(r=>r.id===b.dataset.id?{...r,status:b.dataset.action}:r);if(storage.set('requests',all))render()})}$('#incoming').onclick=()=>{tab='incoming';render()};$('#outgoing').onclick=()=>{tab='outgoing';render()};render()}
function chat(){let r=requests().find(x=>x.id===params.get('id'));if(!r){location.href='requests.html';return}layout(`<main class="container chat-box">${pageIntro('A conversation about your request','Talk it through.','<a class="text-link" href="requests.html">← Back to requests</a>')}<div class="panel"><div class="request-card"><img src="${esc(r.image)}" alt=""><div class="request-info"><h3>${esc(r.name)}</h3><p>With ${esc(r.person)} · ${esc(r.start)} to ${esc(r.end)} · ₹${esc(r.price)} / day</p></div><span class="status ${esc(r.status)}">${esc(r.status)}</span></div><div class="notice" style="margin-bottom:16px">Demo chat is stored only in this browser. It is not private messaging and is not delivered to anyone. Confirm important terms in the agreement.</div><div class="messages" id="messages" aria-live="polite"></div><form class="chat-compose" id="chat-form"><input id="message" required maxlength="500" aria-label="Message" placeholder="Write a demo message…"><button class="button">Send ↗</button></form></div></main>`);let key='chat_'+r.id;function render(){const m=storage.get(key,[]);$('#messages').innerHTML='<div class="bubble">Hello! Let’s discuss pickup and return details here. <br><span class="small">Sample message</span></div>'+m.map(x=>`<div class="bubble mine">${esc(x)}</div>`).join('');$('#messages').scrollTop=$('#messages').scrollHeight}$('#chat-form').onsubmit=e=>{e.preventDefault();let m=$('#message').value.trim();if(m&&storage.set(key,[...storage.get(key,[]),m])){$('#message').value='';render()}};render()}
({login:showLogin,home,search,item,list,request,requests:requestsPage,chat}[page]||home)();

</script></body></html>
